name: Continuous Integration
on:
  pull_request:
  push:
    branches:
      - master
      - '*'
    tags: '*'

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: '1.12', os: windows-latest, arch: x64, integration_tests: 1}
          - {version: '1.12', os: ubuntu-latest, arch: x64, integration_tests: 0}
          - {version: '1.12', os: macos-latest, arch: aarch64, integration_tests: 1}
          # previous version
          - {version: '1.11', os: windows-latest, arch: x64, integration_tests: 1}
          - {version: '1.11', os: ubuntu-latest, arch: x64, integration_tests: 0}
          - {version: '1.11', os: macos-latest, arch: aarch64, integration_tests: 1}
          # exotic architectures
          - {version: '1.12', os: ubuntu-22.04-arm, arch: aarch64, integration_tests: 0}
          - {version: '1.12', os: macos-15-intel, arch: x64, integration_tests: 1}
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v1

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        env:
          INTEGRATION_TESTS: ${{ matrix.integration_tests }}
          